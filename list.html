<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List</h1>
    <h2>Ordered List</h2>
    <h1>List of Countries</h1>
    <ol>
        <li>Kenya</li>
        <li>Tanzania</li>
        <li>Uganda</li>
        <li>Rwanda</li>
        <li>Burundi</li>
    </ol>
    <h1>Unordered List</h1>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>
    <h2>Description List</h2>
    <dl>
        <dt>Apple</dt>
        <dd>A fruit that is red or green.</dd>
        <dt>Banana</dt>
        <dd>A fruit that is yellow.</dd>
        <dt>Cherry</dt>
        <dd>A fruit that is red.</dd>
    </dl>
</body>
</html>
